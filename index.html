<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Smart Home</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">

        <h2>🏠</h2>

        <i class="fa-solid fa-table-cells-large"></i>
        <i class="fa-solid fa-lightbulb"></i>
        <i class="fa-solid fa-temperature-half"></i>
        <i class="fa-solid fa-video"></i>
        <i class="fa-solid fa-shield"></i>

    </aside>


    <!-- Main Content -->
    <main class="content">

        <!-- Header -->
        <header>

            <h1>Welcome Home!</h1>

            <div class="search">

                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search">

            </div>

            <div class="profile">

                <div class="circle">H</div>

                <p>Hi, Hajar!</p>

            </div>

        </header>


        <!-- Top Cards -->
        <section class="cards">

            <div class="card">
                <h3>Indoor Temp</h3>
                <p>24°C</p>
            </div>

            <div class="card">
                <h3>Outdoor Temp</h3>
                <p>5°C</p>
            </div>

            <div class="card">
                <h3>Energy Used</h3>
                <p>13 kWh</p>
            </div>

            <div class="card">
                <h3>Solar Energy</h3>
                <p>78 kWh</p>
            </div>

        </section>


        <!-- Dashboard -->
        <section class="dashboard">

            <!-- Living Room -->
            <div class="living">

                <h2>Living Room</h2>

                <img src="living room.jfif" alt="living room"
                alt="Living Room">

            </div>


            <!-- Rooms -->
            <div class="rooms">

                <h2>Rooms</h2>

                <ul>

                    <li>Living Room</li>

                    <li>Bedroom</li>

                    <li>Bathroom</li>

                    <li>Kitchen</li>

                </ul>

            </div>


            <!-- Air Conditioner -->
            <div class="device">

                <h2>Air Conditioner</h2>

                <button>ON</button>

            </div>


            <!-- Light -->
            <div class="device">

                <h2>Light</h2>

                <button>OFF</button>

            </div>

        </section>

    </main>

</div>

</body>
</html>
